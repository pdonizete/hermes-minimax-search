name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala o Hermes Agent (source dos plugins web)
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          echo "HERMES_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          # plugins/web/_common.py do Hermes importa ruamel.yaml; pytest e httpx
          # sao usados pela suite deste plugin.
          python -m pip install pytest httpx "ruamel.yaml"

      - name: Roda a suite
        env:
          HERMES_SRC: ${{ env.HERMES_SRC }}
        run: pytest -q
